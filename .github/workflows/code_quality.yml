name: Code Quality Check

on:
  push:
    branches:
      - main

jobs:
  code_quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run code quality check
      run: |
        flake8 .

    - name: Send email with results
      if: always()
      run: |
        echo "Code Quality Check Results" > results.txt
        flake8 . >> results.txt
        cat results.txt | mail -s "Code Quality Check Results" karim.benna@karimbenna-itconsult.com
      env:
        MAIL_FROM: "bennakarim2306@gmail.com"
        MAIL_TO: "karim.benna@karimbenna-itconsult.com"
        SMTP_SERVER: "smtp.office365.com"
        SMTP_PORT: 587
        SMTP_USERNAME: "bennakarim@hotmail.de"
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
